name: Release

on:
  push:
    tags: ['v*']

# contents to create the release, id-token and attestations to sign the build provenance.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run ci
      - run: npm run build:mcpb
      - name: Record checksums of what users download and run
        run: sha256sum packaging/mcpb/dist/*.mcpb plugins/wassist/server/index.mjs > SHA256SUMS
      # Signs a statement that these exact files were built by this workflow from this commit.
      # Anyone can check it with `gh attestation verify <file> --repo 1337Xcode/wassist-mcp-server`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packaging/mcpb/dist/*.mcpb
            plugins/wassist/server/index.mjs
      - name: Publish the release with the desktop extension and checksums attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packaging/mcpb/dist/*.mcpb SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
